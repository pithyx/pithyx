# Embedded in the standalone GRUB of the ISO by image/build.sh, which fills in @MARKER@ and @VERSION@.
search --no-floppy --set=root --file /.@MARKER@
set timeout=5
set default=0

menuentry "Install Pithyx @VERSION@" {
  linux /live/vmlinuz boot=live live-media-path=/live pithyx.installer quiet loglevel=3
  initrd /live/initrd.img
}

menuentry "Install Pithyx @VERSION@ (show boot messages)" {
  linux /live/vmlinuz boot=live live-media-path=/live pithyx.installer
  initrd /live/initrd.img
}

menuentry "UEFI firmware settings" {
  fwsetup
}
