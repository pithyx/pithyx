# The raw Docker socket (D387), the same mount with the right docker.socket.raw.
services:
  server:
    image: ghcr.io/example/chat-server:1.2.0@sha256:a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
