services:
  server:
    image: ghcr.io/example/chat-server:1.2.0@sha256:a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5
    volumes:
      - type: volume
        source: data
        target: /data
        volume: {nocopy: true}
      - type: tmpfs
        source: data
        target: /tmp
      - type: volume
        source: data
        target: /x
        tmpfs: {size: 1m}
      - type: npipe
        source: data
        target: /y
volumes:
  data:
