# docker.socket and docker.socket.raw together: the mount uses the raw one, so docker.socket stays unused.
services:
  server:
    image: ghcr.io/example/chat-server:1.2.0@sha256:a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5a3f5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
