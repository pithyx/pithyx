<?xml version="1.0" encoding="UTF-8"?>
<!-- A box with a gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox=" 0,0, 64 64 ">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <path id="p" d="M8 8h48v48H8z"/>
  </defs>
  <style><![CDATA[ .a { fill: url( "#g" ); } ]]></style>
  <use href="#p" class="a"/>
  <use xlink:href="#p" fill="url(#g)" style="stroke: URL('#g')"/>
  <animate attributeName="opacity" from="0" to="1" dur="1s"/>
  <a href="#p"><circle cx="32" cy="32" r="4"/></a>
</svg>
