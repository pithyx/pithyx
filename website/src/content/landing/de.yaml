# Every text and picture of the German landing page, with the same keys as en.yaml.
title: Pithyx
description: 'Freies, selbst gehostetes NAS- und Server-Betriebssystem mit Web-Desktop. Deine Dateien, deine Apps, deine Hardware.'
hero:
  title: 'Dein Server, mit Desktop.'
  tagline: 'Pithyx macht aus einem Computer, der dir gehört, einen NAS- und App-Server, den du über einen Desktop im Browser verwaltest: frei, quelloffen und zu 100 Prozent lokal.'
  primary: { label: Loslegen, href: /de/docs/getting-started/quick-start/ }
  secondary: { label: Zur Doku, href: /de/docs/ }
  github: { label: GitHub, href: https://github.com/pithyx/pithyx }
showcase:
  image: ../../assets/screenshots/desktop.de.webp
  alt: 'Der Pithyx-Desktop im Browser: Dateien im Vordergrund, die Einstellungen auf der Seite Pools und das Protokoll-Center dahinter, links Ordner und Verknüpfungen, eine Notiz und unten die Taskleiste'
  caption: 'Der Web-Desktop mit offenem Dateien, Einstellungen und Protokoll-Center. Jede App, ob mitgeliefert oder installiert, öffnet sich in einem solchen Fenster.'
features:
  title: Was schon drin ist
  intro: 'Pithyx installierst du von einem USB-Stick, und der Installer läuft in deinem Browser. Danach verwaltest du Speicher, Freigaben, Benutzer, Apps und das Netzwerk im Web-Desktop.'
  items:
    - {
        icon: 'storage',
        title: 'ZFS-Speicher',
        text: 'Pools von der einzelnen Platte bis RAID-Z3, mit täglichen Wiederherstellungspunkten, Scrubs und SMART-Prüfungen. Eine Platte mit Daten wird erst gelöscht, wenn du ihre Seriennummer eintippst.',
        href: '/de/docs/admin/storage/',
      }
    - {
        icon: 'files',
        title: 'Dateien und Freigaben',
        text: 'Ein Dateimanager im Browser mit Papierkorb und früheren Versionen, dazu Freigaben über SMB 3, SFTP, WebDAV und FTP.',
        href: '/de/docs/user/files/',
      }
    - {
        icon: 'apps',
        title: 'Apps',
        text: 'Installiere Apps aus den signierten Katalogen des Projekts, aus eigenen Katalogen oder aus einer Paketdatei. Backends laufen in Containern ohne Internetzugang, außer die App fragt danach, und ein Update lässt sich zurücknehmen.',
        href: '/de/docs/admin/apps-and-store/',
      }
    - {
        icon: 'users',
        title: 'Benutzer und Gruppen',
        text: 'Rechte pro Freigabe, Dateidienst und App, vergeben an Benutzer und Gruppen. Zwei-Faktor-Anmeldung mit jeder Authenticator-App (TOTP).',
        href: '/de/docs/admin/users-and-groups/',
      }
    - {
        icon: 'network',
        title: 'Netzwerk',
        text: 'Feste Adressen, Bonds und VLANs im Browser. Eine Änderung geht nach 60 Sekunden zurück, wenn du sie nicht bestätigst, und das Konsolenmenü setzt eine Box zurück, aus der du dich ausgesperrt hast.',
        href: '/de/docs/admin/network/',
      }
    - {
        icon: 'updates',
        title: 'Updates und Sicherung',
        text: 'Signierte Systemupdates mit einem Snapshot vor jedem und einem automatischen Weg zurück, wenn die neue Version ihre Prüfung nicht besteht. Benutzer, Freigaben und Einstellungen kommen in eine Sicherungsdatei, verschlüsselt mit deinem Passwort.',
        href: '/de/docs/install/updates/',
      }
why:
  title: Warum Pithyx
  intro: 'Pithyx ist für Leute, die ihre Dateien und Apps auf eigener Hardware haben wollen, verwaltet im Browser, ohne irgendwo ein Konto. Version 1.0 ist als Beta gekennzeichnet: Wir halten sie für stabil, aber sie muss sich im Alltag noch bewähren, also halte eine Sicherung bereit.'
  items:
    - {
        title: 'Frei und offen',
        text: 'Das System steht unter AGPL-3.0, die Pakete für App-Entwickler unter MIT. Es gibt keine bezahlte Edition, und der ganze Code liegt auf GitHub.',
      }
    - {
        title: '100 Prozent lokal',
        text: 'Keine Telemetrie, kein Cloud-Konto und kein Server des Projekts, von dem die Box abhängt. Nach außen verbindet sie sich nur für die App-Kataloge, die du einschaltest, deren Images und die Uhrzeit, und die Doku nennt jede dieser Verbindungen.',
      }
    - {
        title: 'Ein echter Desktop',
        text: 'Fenster, Taskleiste, Verknüpfungen und Notizen im Browser, auf PC, Tablet oder Handy. Die mitgelieferten Apps nutzen dasselbe SDK wie jede App, die du installierst.',
      }
    - {
        title: 'Von Haus aus vorsichtig',
        text: 'Platten mit Daten brauchen ihre Seriennummer, Netzwerkänderungen gehen zurück, wenn du sie nicht bestätigst, App-Backends laufen ohne Root-Rechte auf dem Host, und SSH bleibt aus, bis du es einschaltest. Der Desktop spricht HTTPS mit einem Zertifikat der eigenen, lokal begrenzten Zertifizierungsstelle der Box.',
      }
specs:
  title: Auf einen Blick
  rows:
    - { label: 'Basis', value: 'Debian 13' }
    - { label: 'Plattform', value: '64-Bit x86 (x86-64-v2), UEFI, Secure Boot aus' }
    - { label: 'Mindestens', value: '2 GB RAM, eine Systemplatte mit 32 GB' }
    - { label: 'Referenzhardware', value: 'Intel N100 oder N305, 8 GB RAM' }
    - { label: 'Systemplatte', value: 'btrfs auf einer Platte oder einem Spiegel aus zwei' }
    - { label: 'Datenspeicher', value: 'OpenZFS-Pools, von der einzelnen Platte bis RAID-Z3' }
    - { label: 'Dateidienste', value: 'SMB 3, SFTP, WebDAV, FTP mit TLS' }
    - { label: 'Netzwerk', value: 'Kabelgebunden, IPv4 und IPv6, Bonds und VLANs' }
    - { label: 'Apps', value: 'Statische Frontends, Backends in Docker-Containern' }
    - {
        label: 'Web-Desktop',
        value: 'HTTPS auf Port 7484, mit der Box als eigener Zertifizierungsstelle',
      }
    - { label: 'Sprachen', value: 'Englisch, Deutsch' }
    - { label: 'Lizenz', value: 'AGPL-3.0, npm-Pakete für App-Entwickler MIT' }
