ai:
  title: Für KI-Assistenten
  intro: Die ganze Doku ist reines Markdown. Gib deinem Assistenten eine dieser Adressen, von klein bis alles auf einmal.
  levels:
    - {
        title: 'Index',
        text: 'Eine Liste aller Seiten mit je einer Zeile. Zuerst lesen, dann nur die nötige Seite holen, zum Beispiel /de/docs/admin/storage.md.',
        path: '/de/llms.txt',
      }
    - {
        title: 'Ein Bereich',
        text: 'Alle Seiten eines Bereichs in einer Datei: getting-started, user, admin, install, developers, sdk, reference, project oder faq.',
        path: '/de/llms/admin.txt',
      }
    - {
        title: 'Alles',
        text: 'Alle Seiten und die FAQ in einer einzigen Datei, für Assistenten mit großem Kontext.',
        path: '/de/llms-full.txt',
      }
  promptLabel: Ein Prompt für den Anfang
  prompt: 'Lies {site}/de/llms.txt, hol dir die nötigen Seiten als Markdown und beantworte meine Frage zu Pithyx mit Links auf die Seiten, die du benutzt hast: '
  copy: Prompt kopieren
  copied: Kopiert
cta:
  title: Lust, es auszuprobieren?
  text: 'Pithyx 1.0 ist als Beta gekennzeichnet. Die Anleitung führt dich durch das Image, den USB-Stick und den Web-Installer. Halte von Daten, die dir wichtig sind, eine Sicherung bereit.'
  primary: { label: So installierst du, href: /de/docs/install/usb-stick/ }
  secondary: { label: Auf GitHub ansehen, href: https://github.com/pithyx/pithyx }
