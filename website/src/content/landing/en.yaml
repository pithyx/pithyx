# Every text and picture of the English landing page. The German page reads de.yaml with the same keys.
# Image paths are relative to this file; the screenshots are in src/assets/screenshots/ (<name>.webp in English, <name>.de.webp in German).
title: Pithyx
description: 'Free, self-hosted NAS and server OS with a web desktop. Your files, your apps, your hardware.'
hero:
  title: 'Your server, with a desktop.'
  tagline: 'Pithyx turns a computer you own into a NAS and app server that you manage from a desktop in your browser: free, open source and 100 percent local.'
  primary: { label: Get started, href: /docs/getting-started/quick-start/ }
  secondary: { label: Read the docs, href: /docs/ }
  github: { label: GitHub, href: https://github.com/pithyx/pithyx }
showcase:
  image: ../../assets/screenshots/desktop.webp
  alt: 'The Pithyx desktop in a browser: the Files and Storage windows side by side, two shortcuts and a sticky note on the desktop and the taskbar at the bottom'
  caption: 'The web desktop with Files and Storage open side by side. Every app, built in or installed, opens in a window like these.'
features:
  title: What is built in
  intro: 'Pithyx installs from a USB stick, and the installer runs in your browser. After that you manage storage, sharing, users, apps and the network in the web desktop.'
  items:
    - {
        icon: 'storage',
        title: 'ZFS storage',
        text: 'Pools from a single disk to RAID-Z3, with daily restore points, scrubs and SMART checks. A disk that holds data is only wiped after you type its serial number.',
        href: '/docs/admin/storage/',
      }
    - {
        icon: 'files',
        title: 'Files and sharing',
        text: 'A file manager in the browser with a recycle bin and previous versions, and shared folders over SMB 3, SFTP, WebDAV and FTP.',
        href: '/docs/user/files/',
      }
    - {
        icon: 'apps',
        title: 'Apps',
        text: 'Install apps from the signed project catalogs, your own catalogs or a package file. Backends run in containers without internet access unless the app asks for it, and an update can be rolled back.',
        href: '/docs/admin/apps-and-store/',
      }
    - {
        icon: 'users',
        title: 'Users and groups',
        text: 'Rights per shared folder, file service and app, given to users and groups. Two-factor sign-in with any authenticator app (TOTP).',
        href: '/docs/admin/users-and-groups/',
      }
    - {
        icon: 'network',
        title: 'Network',
        text: 'Static addresses, bonds and VLANs in the browser. A change goes back after 60 seconds unless you confirm it, and the console menu resets a box you locked yourself out of.',
        href: '/docs/admin/network/',
      }
    - {
        icon: 'updates',
        title: 'Updates and backup',
        text: 'Signed system updates with a snapshot before each one and an automatic way back when the new version fails its check. Users, shared folders and settings go into one backup file encrypted with your password.',
        href: '/docs/install/updates/',
      }
why:
  title: Why Pithyx
  intro: 'Pithyx is for people who want their files and apps on hardware they own, managed in a browser, without an account anywhere. It is pre-release software: try it, but do not trust it with data you cannot lose yet.'
  items:
    - {
        title: 'Free and open',
        text: 'The system is licensed under AGPL-3.0, the packages for app developers under MIT. There is no paid edition, and all of the code is on GitHub.',
      }
    - {
        title: '100 percent local',
        text: 'No telemetry, no cloud account and no project server the box depends on. It connects out only for the app catalogs you enable, their images and the time, and the docs list each of these connections.',
      }
    - {
        title: 'A real desktop',
        text: 'Windows, a taskbar, shortcuts and notes in the browser, on a PC, tablet or phone. The built-in apps use the same SDK as every app you install.',
      }
    - {
        title: 'Careful by default',
        text: 'Disks with data need their serial number, network changes roll back unless you confirm them, app backends run unprivileged and SSH stays off until you switch it on. The desktop still uses plain HTTP, so keep the box on a network you trust.',
      }
specs:
  title: At a glance
  rows:
    - { label: 'Base', value: 'Debian 13' }
    - { label: 'Platform', value: '64-bit x86 (x86-64-v2), UEFI, Secure Boot off' }
    - { label: 'Minimum', value: '4 GB RAM, a 40 GB system disk' }
    - { label: 'Reference hardware', value: 'Intel N100 or N305, 8 GB RAM' }
    - { label: 'System disk', value: 'btrfs on one disk or a mirror of two' }
    - { label: 'Data storage', value: 'OpenZFS pools, from a single disk to RAID-Z3' }
    - { label: 'File services', value: 'SMB 3, SFTP, WebDAV, FTP with TLS' }
    - { label: 'Network', value: 'Wired, IPv4 and IPv6, bonds and VLANs' }
    - { label: 'Apps', value: 'Static frontends, backends in Docker containers' }
    - { label: 'Web desktop', value: 'HTTP on port 7484 (HTTPS not built yet)' }
    - { label: 'Languages', value: 'English, German' }
    - { label: 'License', value: 'AGPL-3.0, npm packages for app developers MIT' }
gallery:
  title: A look inside
  close: Close
  items:
    - {
        image: '../../assets/screenshots/files.webp',
        alt: 'The Files app with the shared folders in the sidebar, a folder of twelve holiday photos in list view and the context menu of one photo open',
        caption: 'Files: shared folders, the recycle bin and previous versions in the browser.',
      }
    - {
        image: '../../assets/screenshots/storage.webp',
        alt: 'The Storage app with a healthy RAID-Z1 pool of four disks, its used and free space and the list of its disks',
        caption: 'Storage: ZFS pools and disks, with the exact commands shown before anything runs.',
      }
    - {
        image: '../../assets/screenshots/store.webp',
        alt: 'The Store on the Installed tab with four installed apps, among them a chat app and the SDK showcase',
        caption: 'Store: apps from catalogs or a file, with updates and a way back to the previous version.',
      }
    - {
        image: '../../assets/screenshots/settings.webp',
        alt: 'Settings on the Users page with four users and the badges Administrator and Two-factor',
        caption: 'Settings: users and groups, shared folders, file services, network and backup.',
      }
ai:
  title: For AI assistants
  intro: All docs are plain Markdown. Point your assistant at one of these addresses, from the smallest to everything at once.
  levels:
    - {
        title: 'Index',
        text: 'A list of every page with one line each. Read it first, then fetch only the page you need, for example /docs/admin/storage.md.',
        path: '/llms.txt',
      }
    - {
        title: 'One area',
        text: 'Every page of one area in one file: getting-started, user, admin, install, developers, sdk, reference, project or faq.',
        path: '/llms/admin.txt',
      }
    - {
        title: 'Everything',
        text: 'All pages and the FAQ in a single file, for assistants with a large context.',
        path: '/llms-full.txt',
      }
  promptLabel: A prompt to start with
  prompt: 'Read {site}/llms.txt, fetch the pages you need as Markdown and answer my question about Pithyx with links to the pages you used: '
  copy: Copy prompt
  copied: Copied
cta:
  title: Want to try it?
  text: 'Pithyx is pre-release software. The guide walks you through the image, the USB stick and the web installer. Try it on a spare computer or in a virtual machine, not with data you cannot lose.'
  primary: { label: How to install, href: /docs/install/usb-stick/ }
  secondary: { label: Star on GitHub, href: https://github.com/pithyx/pithyx }
