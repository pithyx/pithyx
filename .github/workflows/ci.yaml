name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev, beta, stable]
  workflow_dispatch:
  # The nightly run: the whole suite including E2E. Scheduled runs start on the default branch (stable), so every
  # checkout below takes dev for them (D367).
  schedule:
    - cron: '17 1 * * *'

# Read-only token for every job; a job that needs more asks for it itself. No pull_request_target, no secrets.
permissions:
  contents: read

# Every job runs on GitHub-hosted runners (D368); a pull request from a fork runs only after a maintainer approved the
# run (repository setting "Fork pull request workflows"; see CLAUDE.md, CI). No job uses services or containers, and
# nothing here needs ZFS, real disks or root: those tests run on a dev VM (tools/dev-vm/integration.sh).

# One run per branch: a new push to a pull request cancels the run it replaces. Runs on dev, beta and stable always finish,
# so every merge is checked. Adding any label but e2e skips every job, so such a run gets a group of its own and never
# cancels the real one.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  LC_ALL: C.UTF-8

jobs:
  # Pull requests that change only docs skip the builds; the daemon job needs a daemon-side change. Adding a label runs
  # the checks again only for the label e2e, which also runs the E2E suite (D278).
  # Forks of the repository do not run the nightly schedule.
  changes:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
      && (github.event_name != 'schedule' || github.repository == 'pithyx/pithyx')
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.areas.outputs.code }}
      daemon: ${{ steps.areas.outputs.daemon }}
      frontend: ${{ steps.areas.outputs.frontend }}
      website: ${{ steps.areas.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: 0
      - id: areas
        run: tools/checks/changed-areas.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  daemon:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    env:
      PITHYX_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - run: dotnet restore daemon/Pithyx.slnx
      - run: dotnet build daemon/Pithyx.slnx --configuration Release --no-restore
      - name: OpenAPI document is up to date
        run: git diff --exit-code packages/api-client/openapi.json
      # The ZFS and Linux account tests need root and real ZFS; they run on the dev VM (tools/dev-vm/integration.sh).
      # The timing budgets run in the E2E job, where no parallel build skews them (D280). A failed test that is a known
      # flake (SQLite "database is locked", the ProcessCommandRunner stream test) is rerun once, alone and visibly; any
      # other failure fails the job (tools/checks/dotnet-test-retry.ts).
      - run: >-
          node tools/checks/dotnet-test-retry.ts -- --solution daemon/Pithyx.slnx --configuration Release --no-build
          --filter-not-trait "Category=StorageIntegration" --filter-not-trait "Category=DockerIntegration" --filter-not-trait "Category=NetworkIntegration" --filter-not-trait "Category=TimingBudget" --filter-not-trait "Category=AcmeIntegration"
      # Only whitespace: the build already fails on every style and analyzer warning (EnforceCodeStyleInBuild), and the full
      # format run compiled the solution a second time (D350).
      - run: dotnet format whitespace daemon/Pithyx.slnx --verify-no-changes

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # TypeDoc for @pithyx/sdk and @pithyx/ui: an export without documentation fails the job.
      - run: pnpm check:docs
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  # The website (Astro + Starlight): type check, build, and the check that every docs page has its Markdown twin and the
  # llms files exist. Deploying is .github/workflows/pages.yaml.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pithyx/website check
      - run: pnpm --filter @pithyx/website build:site

  repo:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/checks/repo-check.ts
      - run: pnpm format:check
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Commit messages
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: node tools/checks/commit-msg.ts --range "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Both checks read a pull request's or push's range; a manual or nightly run has none, so they are skipped there.
      # Sign-off (DCO) of every commit in the range; part of this job so it needs no runner of its own.
      - name: Sign-off
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: node tools/checks/dco.ts "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The E2E suite, the performance gate and the design checks take minutes, so they run only when asked (D278): the
  # label e2e on a pull request, a manual run, the nightly run, and every pull request or push to beta and stable.
  e2e:
    # It waits for the daemon job and runs whether that job passed, failed or was skipped (D280).
    needs: [changes, daemon]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref_name == 'stable' || github.base_ref == 'stable'
      || github.ref_name == 'beta' || github.base_ref == 'beta'
      || contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    env:
      # The performance gate guards pull requests; after the merge, dev runs the other E2E tests only.
      PITHYX_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite runs the daemon only; its tests are the daemon job's.
      - run: dotnet build daemon/src/Pithyx.Daemon
      - run: pnpm --filter "@pithyx/desktop..." build
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @pithyx/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm design:test
      # The daemon's timing budgets, measured in a Release build like the daemon job's tests.
      - run: >-
          dotnet test --project daemon/tests/Pithyx.Daemon.Tests --configuration Release
          --filter-trait "Category=TimingBudget"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
