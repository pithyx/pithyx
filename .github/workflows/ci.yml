name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run it replaces. Runs on dev and master always finish,
# so every merge is checked.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  LC_ALL: C.UTF-8

jobs:
  # Pull requests that change only docs skip the builds and E2E; the daemon job needs a daemon-side change, the storage
  # job a change to storage code, its tests or the CI setup.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.areas.outputs.code }}
      daemon: ${{ steps.areas.outputs.daemon }}
      frontend: ${{ steps.areas.outputs.frontend }}
      storage: ${{ steps.areas.outputs.storage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        run: tools/checks/changed-areas.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  daemon:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    env:
      PITHYX_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - run: dotnet restore daemon/Pithyx.slnx
      - run: dotnet build daemon/Pithyx.slnx --configuration Release --no-restore
      - name: OpenAPI document is up to date
        run: git diff --exit-code packages/api-client/openapi.json
      - run: dotnet test --solution daemon/Pithyx.slnx --configuration Release --no-build
      - run: dotnet format daemon/Pithyx.slnx --verify-no-changes --no-restore

  # Real OpenZFS on sparse files and loop devices of this throwaway runner, as root. zpool status -j needs OpenZFS 2.3
  # or newer, which Ubuntu 26.04 ships; the daemon job skips these tests.
  storage:
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-26.04
    # A pool command that waits in the kernel never returns; fail the job instead of holding the runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - run: sudo apt-get update && sudo apt-get install -y zfsutils-linux
      - run: sudo modprobe zfs
      # scsi_debug disks for the disk failure tests (pulled through sysfs and rescanned); in linux-modules-extra on some kernels.
      - run: sudo modprobe -n scsi_debug || sudo apt-get install -y "linux-modules-extra-$(uname -r)"
      - run: zfs version
      - run: dotnet build daemon/tests/Pithyx.Daemon.Tests --configuration Release
      - name: Storage integration tests
        run: sudo -E env "PATH=$PATH" PITHYX_STORAGE_INTEGRATION=1 daemon/tests/Pithyx.Daemon.Tests/bin/Release/net10.0/Pithyx.Daemon.Tests -trait "Category=StorageIntegration"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/checks/repo-check.ts
      - run: pnpm format:check
      - run: shellcheck tools/*/*.sh
      - name: Commit messages
        run: node tools/checks/commit-msg.ts --range "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node tools/checks/dco.ts "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # The performance gate guards pull requests; after the merge, dev runs the other E2E tests only.
      PITHYX_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: dotnet build daemon/Pithyx.slnx
      - run: pnpm --filter "@pithyx/desktop..." build
      - run: pnpm --filter @pithyx/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm design:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
