name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  LC_ALL: C.UTF-8

jobs:
  daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - run: dotnet restore daemon/Vyxis.slnx
      - run: dotnet build daemon/Vyxis.slnx --configuration Release --no-restore
      - name: OpenAPI document is up to date
        run: git diff --exit-code packages/api-client/openapi.json
      - run: dotnet test --solution daemon/Vyxis.slnx --configuration Release --no-build
      - run: dotnet format daemon/Vyxis.slnx --verify-no-changes --no-restore

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm format:check

  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/checks/repo-check.ts
      - run: shellcheck tools/*/*.sh
      - name: Commit messages
        run: node tools/checks/commit-msg.ts --range "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node tools/checks/dco.ts "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: dotnet build daemon/Vyxis.slnx
      - run: pnpm --filter @vyxis/desktop build
      - run: pnpm --filter @vyxis/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm design:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
