name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

# Read-only token for every job; a job that needs more asks for it itself. No pull_request_target, no secrets.
permissions:
  contents: read

# Every job runs on the runner named by the repository variable CI_RUNNER (the owner's self-hosted runner, label
# pithyx-ci) and on GitHub-hosted runners when it is unset. The self-hosted runner has no Docker and no root: no job
# uses services or containers, and nothing here needs ZFS, real disks or root. Those tests run on dev01
# (tools/dev-vm/integration.sh).

# One run per branch: a new push to a pull request cancels the run it replaces. Runs on dev and master always finish,
# so every merge is checked.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  LC_ALL: C.UTF-8

jobs:
  # Pull requests that change only docs skip the builds and E2E; the daemon job needs a daemon-side change.
  changes:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      code: ${{ steps.areas.outputs.code }}
      daemon: ${{ steps.areas.outputs.daemon }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        run: tools/checks/changed-areas.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  daemon:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      PITHYX_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - run: dotnet restore daemon/Pithyx.slnx
      - run: dotnet build daemon/Pithyx.slnx --configuration Release --no-restore
      - name: OpenAPI document is up to date
        run: git diff --exit-code packages/api-client/openapi.json
      - run: dotnet test --solution daemon/Pithyx.slnx --configuration Release --no-build
      - run: dotnet format daemon/Pithyx.slnx --verify-no-changes --no-restore

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  repo:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/checks/repo-check.ts
      - run: pnpm format:check
      - run: shellcheck tools/*.sh tools/*/*.sh
      - name: Commit messages
        run: node tools/checks/commit-msg.ts --range "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  dco:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node tools/checks/dco.ts "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # The performance gate guards pull requests; after the merge, dev runs the other E2E tests only.
      PITHYX_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: dotnet build daemon/Pithyx.slnx
      - run: pnpm --filter "@pithyx/desktop..." build
      # Only a GitHub-hosted runner may install system packages; the self-hosted runner has the libraries already.
      - run: pnpm --filter @pithyx/e2e exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - run: pnpm e2e
      - run: pnpm design:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
