name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

# One run per branch: a new push to a pull request cancels the run it replaces. Runs on dev and master always finish,
# so every merge is checked.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  LC_ALL: C.UTF-8

jobs:
  # Pull requests that change only docs skip the builds and E2E; the daemon job needs a daemon-side change.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.areas.outputs.code }}
      daemon: ${{ steps.areas.outputs.daemon }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        run: tools/checks/changed-areas.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  daemon:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    env:
      VYXIS_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - run: dotnet restore daemon/Vyxis.slnx
      - run: dotnet build daemon/Vyxis.slnx --configuration Release --no-restore
      - name: OpenAPI document is up to date
        run: git diff --exit-code packages/api-client/openapi.json
      - run: dotnet test --solution daemon/Vyxis.slnx --configuration Release --no-build
      - run: dotnet format daemon/Vyxis.slnx --verify-no-changes --no-restore

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/checks/repo-check.ts
      - run: pnpm format:check
      - run: shellcheck tools/*/*.sh
      - name: Commit messages
        run: node tools/checks/commit-msg.ts --range "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node tools/checks/dco.ts "$(tools/checks/ci-range.sh)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # The performance gate guards pull requests; after the merge, dev runs the other E2E tests only.
      VYXIS_SKIP_BUDGETS: ${{ github.event_name == 'push' && github.ref_name == 'dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: daemon/**/packages.lock.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: dotnet build daemon/Vyxis.slnx
      - run: pnpm --filter "@vyxis/desktop..." build
      - run: pnpm --filter @vyxis/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm design:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
