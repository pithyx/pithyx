name: Pages

# Builds website/ and publishes it with GitHub Pages at https://pithyx.org (D340). It runs only once the owner has
# switched Pages on for the public repository and set the repository variable PAGES_ENABLED to true; until then the
# site is built and checked by the website job in ci.yaml only. It deploys from stable, so the site shows the released
# version (D367); the environment github-pages allows only stable.
# workflow_dispatch is the "Run workflow" button (Actions > Pages) to publish the docs by hand; while PAGES_ENABLED is
# not true, a manual run skips both jobs, because the free plan has no Pages for a private repository.
on:
  push:
    branches: [stable]
    paths:
      - website/**
      - i18n/**
      - packages/ui/tokens.css
      - pnpm-lock.yaml
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one but never cancels a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pithyx/website build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
